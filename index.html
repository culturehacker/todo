<style>
:root{color-scheme:light;--ink:#151515;--muted:#888;--line:#e9e9e9;--accent:#7961ee;--bg:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}main{width:min(100%,480px);min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:clamp(42px,9vh,86px) 27px max(26px,env(safe-area-inset-bottom));}header{margin-bottom:24px}h1{font-weight:700;letter-spacing:-1.5px;font-size:39px;line-height:1.1;margin:0 0 6px}.count{color:#777;font-size:15px}.tasks{flex:1;min-height:170px}.task{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}.task-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;gap:8px}.task-front{position:relative;background:#fff;display:flex;align-items:center;min-height:65px;gap:19px;will-change:transform;transition:transform .18s ease}.task-front:after{content:"";height:1px;background:var(--line);position:absolute;bottom:0;left:48px;right:0}.circle{width:26px;height:26px;border-radius:50%;border:1.7px solid #858585;background:#fff;flex:none;padding:0;display:grid;place-items:center}.circle:focus-visible,.delete:focus-visible,.add button:focus-visible,.add input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.task-label{font-size:17px;line-height:1.3;flex:1;overflow-wrap:anywhere}.task-label:focus-visible{outline:2px solid var(--accent)}.empty{font-size:16px;color:#a1a1a1;margin-top:18px}.add{display:flex;align-items:center;background:#f5f5f5;border-radius:13px;min-height:54px;margin-top:28px;padding:0 13px 0 18px;gap:8px}.add input{background:transparent;border:0;outline:none;min-width:0;flex:1;font-size:17px;color:#222}.add input::placeholder{color:#929292}.add button{background:none;border:0;color:var(--accent);font-size:31px;line-height:1;width:33px;height:38px;padding:0}.toast{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#242424;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:22px;font-size:14px;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 22px #0002}.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:#c4b8ff;background:none;border:0;font-weight:650;padding:0}.hint{margin-top:13px;text-align:center;color:#b0b0b0;font-size:12px;opacity:0;transition:opacity .2s}.hint.show{opacity:1}@media (min-width:600px){body{background:#f8f8f8}main{background:#fff;box-shadow:0 0 32px #0000000a}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important}}
</style><link rel="manifest" href="manifest.webmanifest">
</head>
<body><main><header><h1>To Do</h1><div class="count" id="count"></div></header><section class="tasks" aria-label="Tasks" id="tasks"></section><form class="add" id="form"><input id="newTask" maxlength="280" placeholder="Add a task..." aria-label="New task" autocomplete="off"><button type="submit" aria-label="Add task">+</button></form><div class="hint" id="hint">Swipe a task left to complete it</div></main><div class="toast" id="toast" role="status"><span>Task completed</span><button type="button" id="undo">Undo</button></div>
<script>
(()=>{'use strict';const KEY='minimal-todo-v1';const $=s=>document.querySelector(s);const list=$('#tasks'), count=$('#count'),input=$('#newTask'),toast=$('#toast'),hint=$('#hint');let tasks=[],last=null,toastTimeout=null;try{const data=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(data))tasks=data.filter(t=>t&&typeof t.text==='string'&&typeof t.id==='string').slice(0,1000)}catch(e){};const id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('Storage is unavailable. Your changes may not persist in this browser.')}}function updateCount(){count.textContent=tasks.length+' '+(tasks.length===1?'task':'tasks')}function hideToast(){toast.classList.remove('show');clearTimeout(toastTimeout)}function complete(taskId){const idx=tasks.findIndex(t=>t.id===taskId);if(idx<0)return;const task=tasks.splice(idx,1)[0];last={task,idx};save();render();toast.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(hideToast,5500)}function render(){list.replaceChildren();updateCount();if(!tasks.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='All clear.';list.append(empty)}hint.classList.toggle('show',tasks.length>0);for(const t of tasks){const row=document.createElement('div');row.className='task';const back=document.createElement('div');back.className='task-back';back.innerHTML='<span aria-hidden="true">✓</span><span>Complete</span>';const front=document.createElement('div');front.className='task-front';const circle=document.createElement('button');circle.type='button';circle.className='circle';circle.setAttribute('aria-label','Complete '+t.text);circle.onclick=()=>complete(t.id);const label=document.createElement('span');label.className='task-label';label.textContent=t.text;label.title='Double-click to edit';label.addEventListener('dblclick',()=>{const edit=prompt('Edit task',t.text);if(edit===null)return;const value=edit.trim();if(!value)return;t.text=value;save();render()});front.append(circle,label);row.append(back,front);list.append(row);let startX=0,startY=0,delta=0,active=false,locked=false;front.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;active=true;locked=false;delta=0;front.style.transition='none'});front.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(!locked&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){active=false;front.style.transition='';return}if(dx< -7){locked=true;delta=Math.max(-Math.min(row.offsetWidth*.85,260),dx);front.style.transform=`translateX(${delta}px)`}});const release=()=>{if(!active)return;active=false;front.style.transition='';if(delta< -Math.min(100,row.offsetWidth*.3)){complete(t.id)}else{front.style.transform='translateX(0)'}};front.addEventListener('pointerup',release);front.addEventListener('pointercancel',()=>{active=false;front.style.transition='';front.style.transform='translateX(0)'});}}
$('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.push({id:id(),text});input.value='';save();render();input.focus()});$('#undo').addEventListener('click',()=>{if(last){tasks.splice(Math.min(last.idx,tasks.length),0,last.task);last=null;save();render()}hideToast()});render();})();
</script></body></html>
