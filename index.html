<style>
:root{color-scheme:light;--ink:#151515;--muted:#888;--line:#e9e9e9;--accent:#7961ee;--bg:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}main{width:min(100%,480px);min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:clamp(42px,9vh,86px) 27px max(26px,env(safe-area-inset-bottom));}header{margin-bottom:24px}h1{font-weight:700;letter-spacing:-1.5px;font-size:39px;line-height:1.1;margin:0 0 6px}.count{color:#777;font-size:15px}.tasks{flex:1;min-height:170px}.task{position:relative;touch-action:pan-y;user-select:none}.task-swipe{position:relative;overflow:hidden}.task-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;gap:8px}.task-front{position:relative;background:#fff;display:flex;align-items:center;min-height:65px;gap:19px;will-change:transform;transition:transform .18s ease}.task-front:after{content:"";height:1px;background:var(--line);position:absolute;bottom:0;left:48px;right:0}.circle{width:26px;height:26px;border-radius:50%;border:1.7px solid #858585;background:#fff;flex:none;padding:0;display:grid;place-items:center}.circle:focus-visible,.delete:focus-visible,.add button:focus-visible,.add input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.task-label{font-size:17px;line-height:1.3;flex:1;overflow-wrap:anywhere}.task-label:focus-visible{outline:2px solid var(--accent)}.empty{font-size:16px;color:#a1a1a1;margin-top:18px}.add{display:flex;align-items:center;background:#f5f5f5;border-radius:13px;min-height:54px;margin-top:28px;padding:0 13px 0 18px;gap:8px}.add input{background:transparent;border:0;outline:none;min-width:0;flex:1;font-size:17px;color:#222}.add input::placeholder{color:#929292}.add button{background:none;border:0;color:var(--accent);font-size:31px;line-height:1;width:33px;height:38px;padding:0}.toast{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#242424;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:22px;font-size:14px;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 22px #0002}.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:#c4b8ff;background:none;border:0;font-weight:650;padding:0}.hint{margin-top:13px;text-align:center;color:#b0b0b0;font-size:12px;opacity:0;transition:opacity .2s}.hint.show{opacity:1}@media (min-width:600px){body{background:#f8f8f8}main{background:#fff;box-shadow:0 0 32px #0000000a}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important}}

/* Task details: visible only when the user asks for them. */
.task-front{gap:15px}
.task-back{bottom:auto;height:65px}
.task-label{min-width:0}
.task-actions{display:flex;align-items:center;gap:2px;flex:none}
.expand,.visit-link{width:34px;height:42px;border:0;background:transparent;color:#999;display:grid;place-items:center;padding:0;text-decoration:none;border-radius:8px;flex:none}
.expand{font-size:24px;font-weight:300;line-height:1}
.expand[aria-expanded="true"]{color:var(--accent)}
.expand[aria-expanded="true"] .arrow{transform:rotate(180deg)}
.arrow{display:block;transition:transform .18s ease;transform:translateY(-2px)}
.visit-link{font-size:21px;color:var(--accent)}
.expand:focus-visible,.visit-link:focus-visible,.detail-url:focus-visible,.detail-note:focus-visible,.note-links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task.has-extra .expand:not([aria-expanded="true"]){color:#555}
.task-detail{padding:5px 6px 17px 41px;border-bottom:1px solid var(--line);animation:detail-in .15s ease}
.task-detail textarea,.task-detail input{font:inherit;font-size:15px;color:var(--ink);background:#f7f7f7;border:1px solid transparent;border-radius:9px;width:100%;max-width:100%;min-width:0;outline:none}
.task-detail textarea:focus,.task-detail input:focus{background:#fff;border-color:#bcb1ff}
.task-detail textarea{display:block;min-height:85px;padding:11px 12px;line-height:1.45;resize:vertical}
.task-detail textarea::placeholder,.task-detail input::placeholder{color:#aaa}
.link-field{display:flex;align-items:center;gap:9px;margin-top:9px}
.link-field input{flex:1;min-width:0;padding:10px 12px;height:42px}
.detail-link{font-size:13px;white-space:nowrap;max-width:110px;text-overflow:ellipsis;overflow:hidden;color:var(--accent);text-decoration:none}
.detail-link[hidden],.visit-link[hidden],.note-links:empty{display:none}
.note-links{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:10px;font-size:13px}
.note-links a{color:var(--accent);text-decoration:none;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-links a::before{content:"↗ ";font-weight:600}
@keyframes detail-in{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:380px){.task-front{gap:12px}.task-detail{padding-left:37px}}
@media(prefers-reduced-motion:reduce){.task-detail{animation:none}}

</style><link rel="manifest" href="manifest.webmanifest">
</head>
<body><main><header><h1>To Do</h1><div class="count" id="count"></div></header><section class="tasks" aria-label="Tasks" id="tasks"></section><form class="add" id="form"><input id="newTask" maxlength="280" placeholder="Add a task..." aria-label="New task" autocomplete="off"><button type="submit" aria-label="Add task">+</button></form><div class="hint" id="hint">Swipe a task left to complete it</div></main><div class="toast" id="toast" role="status"><span>Task completed</span><button type="button" id="undo">Undo</button></div>
<script>
(()=>{
'use strict';
const KEY='minimal-todo-v1';
const $=s=>document.querySelector(s);
const list=$('#tasks'),count=$('#count'),input=$('#newTask'),toast=$('#toast'),hint=$('#hint');
let tasks=[],last=null,toastTimeout=null;
const expanded=new Set();
try{
  const data=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(data)){
    tasks=data.filter(t=>t&&typeof t.text==='string'&&typeof t.id==='string')
      .slice(0,1000).map(t=>({...t,note:typeof t.note==='string'?t.note:'',url:typeof t.url==='string'?t.url:''}));
  }
}catch(e){}
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(tasks))}
  catch(e){alert('Storage is unavailable. Your changes may not persist in this browser.')}
}
function updateCount(){count.textContent=tasks.length+' '+(tasks.length===1?'task':'tasks')}
function hideToast(){toast.classList.remove('show');clearTimeout(toastTimeout)}
function complete(taskId){
  const idx=tasks.findIndex(t=>t.id===taskId);
  if(idx<0)return;
  const task=tasks.splice(idx,1)[0];
  expanded.delete(taskId);
  last={task,idx};save();render();toast.classList.add('show');
  clearTimeout(toastTimeout);toastTimeout=setTimeout(hideToast,5500);
}
function validUrl(raw){
  const value=(raw||'').trim();
  if(!value)return '';
  try{
    const parsed=new URL(/^https?:\/\//i.test(value)?value:'https://'+value);
    if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname.includes('.'))return '';
    return parsed.href;
  }catch(e){return ''}
}
function findLinks(text){
  const matches=(text||'').match(/(?:https?:\/\/|www\.)[^\s<>"']+/gi)||[];
  return [...new Set(matches.map(x=>validUrl(x.replace(/[),.;!?]+$/g,''))).filter(Boolean))].slice(0,12);
}
function makeLink(url,cls,text){
  const a=document.createElement('a');a.className=cls;a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  a.textContent=text;a.title=url;return a;
}
function makeTask(t){
  const row=document.createElement('div');row.className='task';
  if(t.note.trim()||t.url.trim())row.classList.add('has-extra');
  const back=document.createElement('div');back.className='task-back';
  back.innerHTML='<span aria-hidden="true">✓</span><span>Complete</span>';
  const front=document.createElement('div');front.className='task-front';
  const circle=document.createElement('button');circle.type='button';circle.className='circle';
  circle.setAttribute('aria-label','Complete '+t.text);
  circle.addEventListener('click',()=>complete(t.id));
  const label=document.createElement('span');label.className='task-label';label.textContent=t.text;
  label.title='Double-click to edit';
  label.addEventListener('dblclick',()=>{
    const edit=prompt('Edit task',t.text);if(edit===null)return;
    const value=edit.trim();if(!value)return;
    t.text=value;save();render();
  });
  const actions=document.createElement('div');actions.className='task-actions';
  const visit=makeLink('#','visit-link','↗');visit.setAttribute('aria-label','Open task link');
  const updateVisit=()=>{
    const url=validUrl(t.url);
    visit.hidden=!url;
    if(url)visit.href=url;
    row.classList.toggle('has-extra',Boolean(t.note.trim()||t.url.trim()));
  };
  updateVisit();
  const toggle=document.createElement('button');toggle.type='button';toggle.className='expand';
  toggle.setAttribute('aria-label','Notes and links for '+t.text);
  const isOpen=expanded.has(t.id);
  toggle.setAttribute('aria-expanded',String(isOpen));
  toggle.setAttribute('aria-controls','detail-'+t.id);
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='⌄';
  toggle.append(arrow);
  toggle.addEventListener('click',()=>{
    if(expanded.has(t.id))expanded.delete(t.id);else expanded.add(t.id);
    render();
    if(expanded.has(t.id)){
      const note=document.getElementById('note-'+t.id);
      if(note&&!t.note)note.focus();
    }
  });
  actions.append(visit,toggle);front.append(circle,label,actions);const swipe=document.createElement('div');swipe.className='task-swipe';swipe.append(back,front);row.append(swipe);
  if(isOpen){
    const detail=document.createElement('div');detail.className='task-detail';detail.id='detail-'+t.id;
    const note=document.createElement('textarea');note.className='detail-note';note.id='note-'+t.id;
    note.placeholder='Add a note…';note.setAttribute('aria-label','Notes for '+t.text);
    note.value=t.note;note.rows=3;
    const links=document.createElement('div');links.className='note-links';
    const drawNoteLinks=()=>{
      links.replaceChildren();
      for(const url of findLinks(t.note)){
        const display=new URL(url);
        const readable=display.hostname.replace(/^www\./,'')+display.pathname.replace(/\/$/,'');
        links.append(makeLink(url,'',readable.length>55?readable.slice(0,52)+'…':readable));
      }
    };
    drawNoteLinks();
    note.addEventListener('input',()=>{
      t.note=note.value;save();drawNoteLinks();
      row.classList.toggle('has-extra',Boolean(t.note.trim()||t.url.trim()));
    });
    const linkField=document.createElement('div');linkField.className='link-field';
    const urlInput=document.createElement('input');urlInput.className='detail-url';
    urlInput.type='url';urlInput.autocapitalize='off';urlInput.autocomplete='off';
    urlInput.spellcheck=false;urlInput.placeholder='Paste a URL…';
    urlInput.setAttribute('aria-label','Link for '+t.text);urlInput.value=t.url;
    const linkPreview=makeLink('#','detail-link','Open ↗');
    const refreshLink=()=>{
      const url=validUrl(t.url);linkPreview.hidden=!url;
      if(url)linkPreview.href=url;
      updateVisit();
    };
    refreshLink();
    urlInput.addEventListener('input',()=>{t.url=urlInput.value;save();refreshLink()});
    urlInput.addEventListener('blur',()=>{
      const normalized=validUrl(t.url);
      if(normalized&&normalized!==t.url){t.url=normalized;urlInput.value=normalized;save()}
    });
    linkField.append(urlInput,linkPreview);
    detail.append(note,linkField,links);row.append(detail);
  }
  let startX=0,startY=0,delta=0,active=false,locked=false;
  front.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a,input,textarea'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    startX=e.clientX;startY=e.clientY;active=true;locked=false;delta=0;
    front.style.transition='none';
  });
  front.addEventListener('pointermove',e=>{
    if(!active)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!locked&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){
      active=false;front.style.transition='';return;
    }
    if(dx< -7){
      locked=true;delta=Math.max(-Math.min(row.offsetWidth*.85,260),dx);
      front.style.transform='translateX('+delta+'px)';
    }
  });
  const release=()=>{
    if(!active)return;active=false;front.style.transition='';
    if(delta< -Math.min(100,row.offsetWidth*.3))complete(t.id);
    else front.style.transform='translateX(0)';
  };
  front.addEventListener('pointerup',release);
  front.addEventListener('pointercancel',()=>{
    active=false;front.style.transition='';front.style.transform='translateX(0)';
  });
  return row;
}
function render(){
  list.replaceChildren();updateCount();
  if(!tasks.length){
    const empty=document.createElement('p');empty.className='empty';empty.textContent='All clear.';
    list.append(empty);
  }
  hint.classList.toggle('show',tasks.length>0);
  for(const t of tasks)list.append(makeTask(t));
}
$('#form').addEventListener('submit',e=>{
  e.preventDefault();let text=input.value.trim();if(!text)return;
  let url='';
  const match=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/i);
  if(match){
    const candidate=validUrl(match[0].replace(/[),.;!?]+$/g,''));
    if(candidate){
      url=candidate;
      const remaining=text.replace(match[0],'').trim();
      if(remaining)text=remaining;
      else text=new URL(url).hostname.replace(/^www\./,'');
    }
  }
  tasks.push({id:id(),text,note:'',url});
  input.value='';save();render();input.focus();
});
$('#undo').addEventListener('click',()=>{
  if(last){tasks.splice(Math.min(last.idx,tasks.length),0,last.task);last=null;save();render()}
  hideToast();
});
render();
})();
</script></body></html>
