<style>
:root{color-scheme:light;--ink:#151515;--muted:#888;--line:#e9e9e9;--accent:#7961ee;--bg:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}main{width:min(100%,480px);min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:clamp(42px,9vh,86px) 27px max(26px,env(safe-area-inset-bottom));}header{margin-bottom:24px}h1{font-weight:700;letter-spacing:-1.5px;font-size:39px;line-height:1.1;margin:0 0 6px}.count{color:#777;font-size:15px}.tasks{flex:1;min-height:170px}.task{position:relative;touch-action:pan-y;user-select:none}.task-swipe{position:relative;overflow:hidden}.task-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;gap:8px}.task-front{position:relative;background:#fff;display:flex;align-items:center;min-height:65px;gap:19px;will-change:transform;transition:transform .18s ease}.task-front:after{content:"";height:1px;background:var(--line);position:absolute;bottom:0;left:48px;right:0}.circle{width:26px;height:26px;border-radius:50%;border:1.7px solid #858585;background:#fff;flex:none;padding:0;display:grid;place-items:center}.circle:focus-visible,.delete:focus-visible,.add button:focus-visible,.add input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.task-label{font-size:17px;line-height:1.3;flex:1;overflow-wrap:anywhere}.task-label:focus-visible{outline:2px solid var(--accent)}.task-label{cursor:text}.task-edit{flex:1;min-width:0;width:100%;font-size:17px;line-height:1.3;min-height:42px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:#faf9ff;color:var(--ink);padding:7px 6px;outline:none}.empty{font-size:16px;color:#a1a1a1;margin-top:18px}.add{display:flex;align-items:center;background:#f5f5f5;border-radius:13px;min-height:54px;margin-top:28px;padding:0 13px 0 18px;gap:8px}.add input{background:transparent;border:0;outline:none;min-width:0;flex:1;font-size:17px;color:#222}.add input::placeholder{color:#929292}.add button{background:none;border:0;color:var(--accent);font-size:31px;line-height:1;width:33px;height:38px;padding:0}.toast{position:fixed;bottom:calc(105px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:#242424;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:22px;font-size:14px;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 22px #0002}.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:#c4b8ff;background:none;border:0;font-weight:650;padding:0}.hint{margin-top:13px;text-align:center;color:#b0b0b0;font-size:12px;opacity:0;transition:opacity .2s}.hint.show{opacity:1}@media (min-width:600px){body{background:#f8f8f8}main{background:#fff;box-shadow:0 0 32px #0000000a}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important}}

/* Task details: visible only when the user asks for them. */
.task-front{gap:15px}
.task-back{bottom:auto;height:65px}
.task-label{min-width:0}
.task-actions{display:flex;align-items:center;gap:2px;flex:none}
.expand,.visit-link{width:34px;height:42px;border:0;background:transparent;color:#999;display:grid;place-items:center;padding:0;text-decoration:none;border-radius:8px;flex:none}
.expand{font-size:24px;font-weight:300;line-height:1}
.expand[aria-expanded="true"]{color:var(--accent)}
.expand[aria-expanded="true"] .arrow{transform:rotate(180deg)}
.arrow{display:block;transition:transform .18s ease;transform:translateY(-2px)}
.visit-link{font-size:21px;color:var(--accent)}
.expand:focus-visible,.visit-link:focus-visible,.detail-url:focus-visible,.detail-note:focus-visible,.note-links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task.has-extra .expand:not([aria-expanded="true"]){color:#555}
.task-detail{padding:5px 6px 17px 41px;border-bottom:1px solid var(--line);animation:detail-in .15s ease}
.task-detail textarea,.task-detail input{font:inherit;font-size:15px;color:var(--ink);background:#f7f7f7;border:1px solid transparent;border-radius:9px;width:100%;max-width:100%;min-width:0;outline:none}
.task-detail textarea:focus,.task-detail input:focus{background:#fff;border-color:#bcb1ff}
.task-detail textarea{display:block;min-height:85px;padding:11px 12px;line-height:1.45;resize:vertical}
.task-detail textarea::placeholder,.task-detail input::placeholder{color:#aaa}
.link-field{display:flex;align-items:center;gap:9px;margin-top:9px}
.link-field input{flex:1;min-width:0;padding:10px 12px;height:42px}
.detail-link{font-size:13px;white-space:nowrap;max-width:110px;text-overflow:ellipsis;overflow:hidden;color:var(--accent);text-decoration:none}
.detail-link[hidden],.visit-link[hidden],.note-links:empty{display:none}
.note-links{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:10px;font-size:13px}
.note-links a{color:var(--accent);text-decoration:none;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-links a::before{content:"↗ ";font-weight:600}
@keyframes detail-in{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:380px){.task-front{gap:12px}.task-detail{padding-left:37px}}
@media(prefers-reduced-motion:reduce){.task-detail{animation:none}}


/* Quiet, optional multi-line import: the standard list remains unchanged. */
.import-trigger{display:flex;justify-content:center;margin-top:12px}
.import-trigger button{border:0;background:transparent;color:#888;font-size:13px;padding:8px 18px;border-radius:8px}
.import-trigger button:hover,.import-trigger button[aria-expanded="true"]{color:var(--accent)}
.import-trigger button:focus-visible,.close-import:focus-visible,#bulkText:focus-visible,#confirmImport:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.import-panel{padding:17px 16px 15px;background:#f7f7f7;border-radius:14px;margin-top:18px}
.import-panel[hidden]{display:none}
.import-heading{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:12px}
.close-import{background:transparent;border:0;font-size:23px;color:#777;width:36px;height:32px;padding:0;line-height:1}
#bulkText{display:block;width:100%;max-width:100%;min-width:0;min-height:150px;resize:vertical;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);padding:12px 13px;border:1px solid #e6e6e6;border-radius:9px;background:#fff}
#bulkText::placeholder{color:#aaa}
.import-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
#importPreview{font-size:12px;color:#808080;line-height:1.4;flex:1}
#confirmImport{border:0;border-radius:9px;background:var(--accent);color:white;padding:11px 15px;font-weight:600;font-size:14px;white-space:nowrap}
#confirmImport:disabled{background:#dedede;color:#888;cursor:default}


/* Pin and reorder: one quiet interaction at each end of a task. */
.task.pinned .circle{border-color:var(--accent)}
.task.pinned .circle::after{content:"";display:block;width:10px;height:10px;background:var(--accent);border-radius:50%}
.task.pinned .task-label{font-weight:550}
.drag-handle{width:31px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b1b1b1;padding:0;touch-action:none;cursor:grab}
.drag-handle:focus-visible{outline:2px solid var(--accent);outline-offset:1px;color:var(--accent)}
.drag-handle:hover{color:#777}
.task.dragging{position:relative;z-index:3;box-shadow:0 4px 18px #00000014;border-radius:9px}
.task.dragging .task-front{background:#faf9ff}
.task.dragging .drag-handle{cursor:grabbing;color:var(--accent)}
@media(max-width:380px){.task-front{gap:10px}.task-actions{gap:0}.drag-handle{width:29px}}

.task-render-fallback{padding:18px 0 18px 48px;border-bottom:1px solid var(--line);color:var(--ink);font-size:17px}

/* Collapsible one-level subtasks: visually subordinate, no extra screen. */
.task-title-group{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px}
.task-title-group .task-label{flex:none;width:100%}
.subtask-progress{color:#999;font-size:12px;line-height:1.2;font-variant-numeric:tabular-nums}
.subtask-progress:empty{display:none}
.subtasks{margin:2px 0 16px;min-width:0}
.subtasks-heading{font-size:10px;letter-spacing:.09em;font-weight:650;color:#aaa;margin:3px 0 9px}
.subtasks-list{display:flex;flex-direction:column}
.subtask{display:flex;align-items:center;gap:11px;min-height:41px;border-bottom:1px solid #efefef;user-select:none}
.subtask-circle{width:20px;height:20px;border-radius:50%;border:1.5px solid #aaa;background:#fff;flex:none;padding:0;display:grid;place-items:center}
.subtask.done .subtask-circle{border-color:var(--accent);background:var(--accent)}
.subtask.done .subtask-circle::after{content:"✓";color:#fff;font-size:13px;line-height:1}
.subtask-text{font-size:15px;line-height:1.35;flex:1;min-width:0;overflow-wrap:anywhere;cursor:text;padding:10px 0}
.subtask.done .subtask-text{color:#aaa;text-decoration:line-through}
.subtask-actions{display:flex;align-items:center;gap:1px;flex:none}
.subtask-link{color:var(--accent);text-decoration:none;font-size:17px;padding:5px}
.subtask-grip{width:30px;height:38px;background:transparent;border:0;color:#b8b8b8;touch-action:none;cursor:grab;font-size:21px;line-height:1}
.subtask-dragging{background:#faf9ff}
.subtask-add{display:flex;align-items:center;gap:4px;margin-top:8px}
.subtask-add input{border:0;background:transparent;font-size:15px;height:42px;padding:7px 0 7px 4px;flex:1;min-width:0;max-width:100%;outline:none}
.subtask-add input:focus{background:transparent;border:0}
.subtask-add button{border:0;background:transparent;color:var(--accent);font-size:25px;width:33px;height:40px;flex:none;padding:0}
.subtask-edit{border:0;border-bottom:2px solid var(--accent);outline:none;background:#faf9ff;flex:1;min-width:0;font-size:15px;line-height:1.35;padding:7px 4px}
.subtask-grip:focus-visible,.subtask-circle:focus-visible,.subtask-text:focus-visible,.subtask-add button:focus-visible,.subtask-add input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.task-detail>.detail-note{margin-top:4px}
#undo[hidden]{display:none}
</style><link rel="manifest" href="manifest.webmanifest">

<body><main><header><h1>To Do</h1><div class="count" id="count"></div></header><section class="tasks" aria-label="Tasks" id="tasks"></section><section class="import-panel" id="importPanel" aria-labelledby="importTitle" hidden><div class="import-heading"><span id="importTitle">Import tasks</span><button type="button" id="cancelImport" class="close-import" aria-label="Close import">×</button></div><textarea id="bulkText" rows="6" placeholder="Paste tasks here.&#10;One task per line." aria-label="Paste tasks, one per line" spellcheck="false"></textarea><div class="import-footer"><span id="importPreview" role="status">One line = one task</span><button type="button" id="confirmImport" disabled>Add tasks</button></div></section><form class="add" id="form"><input id="newTask" maxlength="280" placeholder="Add a task..." aria-label="New task" autocomplete="off"><button type="submit" aria-label="Add task">+</button></form><div class="import-trigger"><button type="button" id="showImport" aria-expanded="false" aria-controls="importPanel">Import a list</button></div><div class="hint" id="hint">Tap a task to edit · Swipe left to complete · Drag dots to reorder</div></main><div class="toast" id="toast" role="status"><span>Task completed</span><button type="button" id="undo">Undo</button></div>
<script>
(()=>{
'use strict';
const KEY='minimal-todo-v1';
const $=s=>document.querySelector(s);
const list=$('#tasks'),count=$('#count'),input=$('#newTask'),toast=$('#toast'),hint=$('#hint');
let tasks=[],last=null,toastTimeout=null;
const expanded=new Set();
try{
  const data=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(data)){
    tasks=data.filter(t=>t&&typeof t.text==='string'&&typeof t.id==='string')
      .slice(0,1000).map(t=>({...t,note:typeof t.note==='string'?t.note:'',url:typeof t.url==='string'?t.url:'',pinned:t.pinned===true,
        subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(c=>c&&typeof c.text==='string'&&typeof c.id==='string').slice(0,200).map(c=>({
          id:c.id,text:c.text,done:c.done===true,url:typeof c.url==='string'?c.url:''})):[]}));
  }
}catch(e){}
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();
function sortPinned(){tasks.sort((a,b)=>Number(Boolean(b.pinned))-Number(Boolean(a.pinned)))}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(tasks))}
  catch(e){alert('Storage is unavailable. Your changes may not persist in this browser.')}
}
function updateCount(){
  const remaining=tasks.reduce((sum,t)=>sum+1+(t.subtasks||[]).filter(c=>!c.done).length,0);
  count.textContent=remaining+' '+(remaining===1?'task':'tasks');
}
function showMessage(message,withUndo=false){
  toast.querySelector('span').textContent=message;
  $('#undo').hidden=!withUndo;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(hideToast,withUndo?5500:3200);
}
function hideToast(){toast.classList.remove('show');clearTimeout(toastTimeout)}
function complete(taskId){
  const idx=tasks.findIndex(t=>t.id===taskId);
  if(idx<0)return;
  const pending=(tasks[idx].subtasks||[]).filter(c=>!c.done).length;
  if(pending){
    expanded.add(taskId);
    render();
    showMessage('Complete '+pending+' '+(pending===1?'subtask':'subtasks')+' first');
    return;
  }
  const task=tasks.splice(idx,1)[0];
  expanded.delete(taskId);
  last={task,idx};save();render();showMessage('Task completed',true);
}
function validUrl(raw){
  const value=(raw||'').trim();
  if(!value)return '';
  try{
    const parsed=new URL(/^https?:\/\//i.test(value)?value:'https://'+value);
    if(!['http:','https:'].includes(parsed.protocol)||!parsed.hostname.includes('.'))return '';
    return parsed.href;
  }catch(e){return ''}
}
function findLinks(text){
  const matches=(text||'').match(/(?:https?:\/\/|www\.)[^\s<>"']+/gi)||[];
  return [...new Set(matches.map(x=>validUrl(x.replace(/[),.;!?]+$/g,''))).filter(Boolean))].slice(0,12);
}
function makeLink(url,cls,text){
  const a=document.createElement('a');a.className=cls;a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  a.textContent=text;a.title=url;return a;
}
function makeSubtasks(t){
  const wrapper=document.createElement('section');wrapper.className='subtasks';
  wrapper.setAttribute('aria-label','Subtasks for '+t.text);
  const heading=document.createElement('div');heading.className='subtasks-heading';
  heading.textContent='SUBTASKS';
  const sectionList=document.createElement('div');sectionList.className='subtasks-list';
  function moveChild(childId,by){
    const pos=t.subtasks.findIndex(c=>c.id===childId);
    if(pos<0||pos+by<0||pos+by>=t.subtasks.length)return;
    [t.subtasks[pos],t.subtasks[pos+by]]=[t.subtasks[pos+by],t.subtasks[pos]];
    save();render();
    const parent=[...list.children].find(el=>el.dataset.id===t.id);
    const sub=[...(parent?.querySelectorAll('.subtask')||[])].find(el=>el.dataset.subid===childId);
    sub?.querySelector('.subtask-grip')?.focus({preventScroll:true});
  }
  for(const c of t.subtasks){
    const row=document.createElement('div');row.className='subtask';
    row.dataset.subid=c.id;
    row.classList.toggle('done',Boolean(c.done));
    const circle=document.createElement('button');circle.type='button';circle.className='subtask-circle';
    circle.setAttribute('aria-label',(c.done?'Mark incomplete: ':'Complete subtask: ')+c.text);
    circle.setAttribute('aria-pressed',String(Boolean(c.done)));
    circle.addEventListener('click',()=>{
      c.done=!c.done;save();render();
    });
    const label=document.createElement('span');label.className='subtask-text';label.textContent=c.text;
    label.tabIndex=0;label.role='button';label.title='Tap to edit subtask';
    label.setAttribute('aria-label','Edit subtask '+c.text);
    const edit=()=>{
      const field=document.createElement('input');field.type='text';field.className='subtask-edit';
      field.maxLength=280;field.value=c.text;field.setAttribute('aria-label','Edit subtask');
      field.setAttribute('enterkeyhint','done');
      label.replaceWith(field);
      let editing=true;
      function finish(cancel=false){
        if(!editing)return;
        editing=false;
        if(!cancel&&field.value.trim()){
          const changed=taskFromLine(field.value.trim());
          c.text=changed.text;c.url=changed.url;
          save();label.textContent=c.text;
          label.setAttribute('aria-label','Edit subtask '+c.text);
          circle.setAttribute('aria-label',(c.done?'Mark incomplete: ':'Complete subtask: ')+c.text);
        }
        field.replaceWith(label);
      }
      field.addEventListener('blur',()=>finish());
      field.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();finish();field.blur()}
        if(e.key==='Escape'){e.preventDefault();finish(true);field.blur()}
      });
      field.focus({preventScroll:true});
      field.setSelectionRange(field.value.length,field.value.length);
    };
    label.addEventListener('click',edit);
    label.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edit()}});
    const actions=document.createElement('div');actions.className='subtask-actions';
    const url=validUrl(c.url);
    if(url)actions.append(makeLink(url,'subtask-link','↗'));
    const grip=document.createElement('button');grip.type='button';grip.className='subtask-grip';
    grip.setAttribute('aria-label','Drag or use arrow keys to reorder subtask '+c.text);
    grip.title='Reorder subtask';grip.textContent='⠿';
    grip.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){
        e.preventDefault();moveChild(c.id,e.key==='ArrowUp'?-1:1);
      }
    });
    grip.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();e.stopPropagation();
      const pointerId=e.pointerId,startY=e.clientY;
      let moved=false;
      const move=event=>{
        if(event.pointerId!==pointerId)return;
        if(!moved&&Math.abs(event.clientY-startY)<5)return;
        moved=true;row.classList.add('subtask-dragging');
        const siblings=[...sectionList.children].filter(el=>el.classList.contains('subtask')&&el!==row);
        const next=siblings.find(el=>{
          const rect=el.getBoundingClientRect();
          return event.clientY<rect.top+rect.height/2;
        });
        if(next)sectionList.insertBefore(row,next);
        else if(siblings.length)sectionList.insertBefore(row,siblings[siblings.length-1].nextSibling);
      };
      const end=event=>{
        if(event.pointerId!==pointerId)return;
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',end);
        window.removeEventListener('pointercancel',end);
        row.classList.remove('subtask-dragging');
        if(!moved)return;
        const map=new Map(t.subtasks.map(item=>[item.id,item]));
        const ordered=[...sectionList.children].map(el=>map.get(el.dataset.subid)).filter(Boolean);
        if(ordered.length===t.subtasks.length){t.subtasks=ordered;save();render()}
      };
      window.addEventListener('pointermove',move,{passive:false});
      window.addEventListener('pointerup',end);
      window.addEventListener('pointercancel',end);
    });
    actions.append(grip);
    row.append(circle,label,actions);
    sectionList.append(row);
  }
  const add=document.createElement('form');add.className='subtask-add';
  const inputChild=document.createElement('input');inputChild.type='text';inputChild.maxLength=280;
  inputChild.placeholder='Add subtask…';inputChild.autocomplete='off';
  inputChild.setAttribute('aria-label','New subtask under '+t.text);
  inputChild.setAttribute('enterkeyhint','done');
  const plus=document.createElement('button');plus.type='submit';plus.textContent='+';
  plus.setAttribute('aria-label','Add subtask');
  add.append(inputChild,plus);
  add.addEventListener('submit',e=>{
    e.preventDefault();
    const lines=parseLines(inputChild.value);
    if(!lines.length)return;
    if(lines.length+t.subtasks.length>200){showMessage('Limit of 200 subtasks');return}
    for(const line of lines){
      const child=taskFromLine(line);
      t.subtasks.push({id:child.id,text:child.text,url:child.url,done:false});
    }
    save();render();
    const parent=[...list.children].find(el=>el.dataset.id===t.id);
    const newInput=parent?.querySelector('.subtask-add input');
    if(window.matchMedia?.('(pointer: coarse)').matches)newInput?.blur();
    else newInput?.focus({preventScroll:true});
  });
  inputChild.addEventListener('paste',e=>{
    const pasted=e.clipboardData?.getData('text/plain')||'';
    if(!/[\r\n\u2028\u2029]/.test(pasted))return;
    const lines=parseLines(pasted);
    if(!lines.length||lines.some(line=>line.length>280))return;
    e.preventDefault();
    const prefix=inputChild.value.trim();
    const all=prefix?[prefix,...lines]:lines;
    if(all.length+t.subtasks.length>200){showMessage('Limit of 200 subtasks');return}
    t.subtasks.push(...all.map(line=>{
      const child=taskFromLine(line);
      return {id:child.id,text:child.text,url:child.url,done:false};
    }));
    save();render();
  });
  wrapper.append(heading,sectionList,add);
  return wrapper;
}
function focusHandle(taskId){
  const row=[...list.children].find(el=>el.dataset.id===taskId);
  row?.querySelector('.drag-handle')?.focus({preventScroll:true});
}
function moveTaskByKeyboard(taskId,step){
  const task=tasks.find(t=>t.id===taskId);
  if(!task)return;
  const group=tasks.filter(t=>Boolean(t.pinned)===Boolean(task.pinned));
  const pos=group.findIndex(t=>t.id===taskId);
  const next=group[pos+step];
  if(!next)return;
  const a=tasks.indexOf(task),b=tasks.indexOf(next);
  [tasks[a],tasks[b]]=[tasks[b],tasks[a]];
  save();render();focusHandle(taskId);
}
function enableDrag(handle,row,task){
  handle.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();
      moveTaskByKeyboard(task.id,e.key==='ArrowUp'?-1:1);
    }
  });
  handle.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    e.preventDefault();
    e.stopPropagation();
    const pointerId=e.pointerId,startY=e.clientY;
    let y=e.clientY,active=false,raf=0;
    document.activeElement?.blur?.();
    const insertAt=(clientY)=>{
      const peers=[...list.children].filter(el=>
        el.classList.contains('task')&&el!==row&&
        el.classList.contains('pinned')===Boolean(task.pinned));
      if(!peers.length)return;
      const before=peers.find(el=>{
        const bounds=el.getBoundingClientRect();
        return clientY<bounds.top+bounds.height/2;
      });
      if(before)list.insertBefore(row,before);
      else list.insertBefore(row,peers[peers.length-1].nextSibling);
    };
    const scrollLoop=()=>{
      if(!active)return;
      const margin=90;
      if(y<margin)window.scrollBy(0,-Math.min(20,(margin-y)/4+3));
      else if(y>window.innerHeight-margin)window.scrollBy(0,Math.min(20,(y-window.innerHeight+margin)/4+3));
      insertAt(y);
      raf=requestAnimationFrame(scrollLoop);
    };
    const move=event=>{
      if(event.pointerId!==pointerId)return;
      y=event.clientY;
      if(!active&&Math.abs(y-startY)<6)return;
      if(!active){
        active=true;
        row.classList.add('dragging');
        raf=requestAnimationFrame(scrollLoop);
      }
      insertAt(y);
    };
    const cleanup=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',end);
      window.removeEventListener('pointercancel',end);
      cancelAnimationFrame(raf);
      row.classList.remove('dragging');
    };
    const end=event=>{
      if(event.pointerId!==pointerId)return;
      cleanup();
      if(!active)return;
      const byId=new Map(tasks.map(t=>[t.id,t]));
      const reordered=[...list.children].filter(el=>el.classList.contains('task'))
        .map(el=>byId.get(el.dataset.id)).filter(Boolean);
      if(reordered.length===tasks.length){
        tasks=reordered;
        save();render();
      }
    };
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',end);
    window.addEventListener('pointercancel',end);
  });
}
function makeTask(t){
  const row=document.createElement('div');row.className='task';row.dataset.id=t.id;
  row.classList.toggle('pinned',Boolean(t.pinned));
  if(t.note.trim()||t.url.trim())row.classList.add('has-extra');
  const back=document.createElement('div');back.className='task-back';
  back.innerHTML='<span aria-hidden="true">✓</span><span>Complete</span>';
  const front=document.createElement('div');front.className='task-front';
  const circle=document.createElement('button');circle.type='button';circle.className='circle';
  circle.setAttribute('aria-label',(t.pinned?'Unpin ':'Pin ')+t.text);
  circle.setAttribute('aria-pressed',String(Boolean(t.pinned)));
  circle.title=t.pinned?'Unpin task':'Pin task';
  circle.addEventListener('click',()=>{
    t.pinned=!Boolean(t.pinned);
    sortPinned();save();render();
    const current=[...list.children].find(el=>el.dataset.id===t.id);
    current?.querySelector('.circle')?.focus({preventScroll:true});
  });
  const titleGroup=document.createElement('div');titleGroup.className='task-title-group';
  const label=document.createElement('span');label.className='task-label';label.textContent=t.text;
  const progress=document.createElement('span');progress.className='subtask-progress';
  if(t.subtasks&&t.subtasks.length){
    const done=t.subtasks.filter(c=>c.done).length;
    progress.textContent=done+'/'+t.subtasks.length;
  }
  titleGroup.append(label,progress);
  label.title='Tap to edit task';
  label.setAttribute('role','button');
  label.setAttribute('tabindex','0');
  label.setAttribute('aria-label','Edit '+t.text);
  let editing=false;
  function editTaskName(){
    if(editing||!row.isConnected)return;
    editing=true;
    const field=document.createElement('input');
    field.type='text';field.className='task-edit';
    field.value=t.text;field.maxLength=280;field.autocomplete='off';
    field.setAttribute('aria-label','Edit task name');
    field.setAttribute('enterkeyhint','done');
    label.replaceWith(field);
    const finish=(cancel=false)=>{
      if(!editing)return;
      editing=false;
      const value=field.value.trim();
      if(!cancel&&value&&value!==t.text){
        t.text=value;save();
        label.textContent=value;
        label.setAttribute('aria-label','Edit '+value);
        circle.setAttribute('aria-label',(t.pinned?'Unpin ':'Pin ')+value);
        toggle.setAttribute('aria-label','Notes and links for '+value);
        grip.setAttribute('aria-label','Reorder '+value+'; drag or use arrow keys');
      }
      field.replaceWith(label);
    };
    field.addEventListener('blur',()=>finish());
    field.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();finish();field.blur()}
      else if(e.key==='Escape'){e.preventDefault();finish(true);field.blur()}
    });
    field.focus({preventScroll:true});
    field.setSelectionRange(field.value.length,field.value.length);
  }
  label.addEventListener('click',()=>{if(!swipeMoved)editTaskName()});
  label.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();editTaskName()}
  });
  const actions=document.createElement('div');actions.className='task-actions';
  const visit=makeLink('#','visit-link','↗');visit.setAttribute('aria-label','Open task link');
  const updateVisit=()=>{
    const url=validUrl(t.url);
    visit.hidden=!url;
    if(url)visit.href=url;
    row.classList.toggle('has-extra',Boolean(t.note.trim()||t.url.trim()));
  };
  updateVisit();
  const toggle=document.createElement('button');toggle.type='button';toggle.className='expand';
  toggle.setAttribute('aria-label','Notes and links for '+t.text);
  const isOpen=expanded.has(t.id);
  toggle.setAttribute('aria-expanded',String(isOpen));
  toggle.setAttribute('aria-controls','detail-'+t.id);
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='⌄';
  toggle.append(arrow);
  toggle.addEventListener('click',()=>{
    if(expanded.has(t.id))expanded.delete(t.id);else expanded.add(t.id);
    render();
    // Expanding never opens the keyboard automatically; choose a subtask,
    // note or URL field deliberately.
  });
  const grip=document.createElement('button');grip.type='button';grip.className='drag-handle';
  grip.title='Drag to reorder';
  grip.setAttribute('aria-label','Reorder '+t.text+'; drag or use arrow keys');
  grip.innerHTML='<svg width="15" height="19" viewBox="0 0 15 19" fill="currentColor" aria-hidden="true"><circle cx="5" cy="4" r="1.35"/><circle cx="10" cy="4" r="1.35"/><circle cx="5" cy="9.5" r="1.35"/><circle cx="10" cy="9.5" r="1.35"/><circle cx="5" cy="15" r="1.35"/><circle cx="10" cy="15" r="1.35"/></svg>';
  enableDrag(grip,row,t);
  actions.append(visit,toggle,grip);front.append(circle,titleGroup,actions);const swipe=document.createElement('div');swipe.className='task-swipe';swipe.append(back,front);row.append(swipe);
  if(isOpen){
    const detail=document.createElement('div');detail.className='task-detail';detail.id='detail-'+t.id;
    const note=document.createElement('textarea');note.className='detail-note';note.id='note-'+t.id;
    note.placeholder='Add a note…';note.setAttribute('aria-label','Notes for '+t.text);
    note.value=t.note;note.rows=3;
    const links=document.createElement('div');links.className='note-links';
    const drawNoteLinks=()=>{
      links.replaceChildren();
      for(const url of findLinks(t.note)){
        const display=new URL(url);
        const readable=display.hostname.replace(/^www\./,'')+display.pathname.replace(/\/$/,'');
        links.append(makeLink(url,'',readable.length>55?readable.slice(0,52)+'…':readable));
      }
    };
    drawNoteLinks();
    note.addEventListener('input',()=>{
      t.note=note.value;save();drawNoteLinks();
      row.classList.toggle('has-extra',Boolean(t.note.trim()||t.url.trim()));
    });
    const linkField=document.createElement('div');linkField.className='link-field';
    const urlInput=document.createElement('input');urlInput.className='detail-url';
    urlInput.type='url';urlInput.autocapitalize='off';urlInput.autocomplete='off';
    urlInput.spellcheck=false;urlInput.placeholder='Paste a URL…';
    urlInput.setAttribute('aria-label','Link for '+t.text);urlInput.value=t.url;
    const linkPreview=makeLink('#','detail-link','Open ↗');
    const refreshLink=()=>{
      const url=validUrl(t.url);linkPreview.hidden=!url;
      if(url)linkPreview.href=url;
      updateVisit();
    };
    refreshLink();
    urlInput.addEventListener('input',()=>{t.url=urlInput.value;save();refreshLink()});
    urlInput.addEventListener('blur',()=>{
      const normalized=validUrl(t.url);
      if(normalized&&normalized!==t.url){t.url=normalized;urlInput.value=normalized;save()}
    });
    linkField.append(urlInput,linkPreview);
    detail.append(makeSubtasks(t),note,linkField,links);row.append(detail);
  }
  let startX=0,startY=0,delta=0,active=false,locked=false,swipeMoved=false;
  front.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a,input,textarea'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    startX=e.clientX;startY=e.clientY;active=true;locked=false;delta=0;swipeMoved=false;
    front.style.transition='none';
  });

    }

    }
  });
  const release=()=>{
    if(!active)return;active=false;front.style.transition='';
    if(delta< -Math.min(100,row.offsetWidth*.3))complete(t.id);
    else front.style.transform='translateX(0)';
  };
  front.addEventListener('pointerup',release);
  front.addEventListener('pointercancel',()=>{
    active=false;front.style.transition='';front.style.transform='translateX(0)';
  });
  return row;
}
function render(){
  // Build the replacement list before touching the visible one. If rendering
  // an individual task fails, the rest of the list stays visible.
  const next=document.createDocumentFragment();
  for(const t of tasks){
    try{next.append(makeTask(t))}
    catch(error){
      console.error('Unable to render task',error);
      const fallback=document.createElement('div');
      fallback.className='task-render-fallback';
      fallback.textContent=t&&typeof t.text==='string'?t.text:'Task';
      next.append(fallback);
    }
  }
  if(!tasks.length){
    const empty=document.createElement('p');empty.className='empty';
    empty.textContent='All clear.';next.append(empty);
  }
  list.replaceChildren(next);
  updateCount();
  hint.classList.toggle('show',tasks.length>0);
}
function focusAfterAdding(){
  // On iOS the focused bottom input can scroll the entire list behind the
  // keyboard. Close the keyboard after +, rather than forcing it to refocus.
  if(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches){
    input.blur();
    window.requestAnimationFrame(()=>window.scrollTo(0,0));
  }else{
    input.focus({preventScroll:true});
  }
}
function taskFromLine(raw){
  let text=raw.trim(),url='';
  const match=text.match(/(?:https?:\/\/|www\.)[^\s<>"']+/i);
  if(match){
    const candidate=validUrl(match[0].replace(/[),.;!?]+$/g,''));
    if(candidate){
      url=candidate;
      const remaining=text.replace(match[0],'').trim();
      if(remaining)text=remaining;
      else text=new URL(url).hostname.replace(/^www\./,'');
    }
  }
  return {id:id(),text,note:'',url,pinned:false,subtasks:[]};
}
const panel=$('#importPanel'),bulk=$('#bulkText'),trigger=$('#showImport'),preview=$('#importPreview'),confirm=$('#confirmImport');
let originalDraft=null;
function parseLines(raw){
  return raw.split(/\r\n|\r|\n|\u2028|\u2029/).map(x=>x.trim()).filter(Boolean);
}
function updateImportPreview(){
  const lines=parseLines(bulk.value);
  const tooLong=lines.filter(x=>x.length>280).length;
  const room=1000-tasks.length;
  const canAdd=lines.length>0&&lines.length<=room&&tooLong===0;
  confirm.disabled=!canAdd;
  confirm.textContent=lines.length?'Add '+lines.length+' '+(lines.length===1?'task':'tasks'):'Add tasks';
  if(tooLong)preview.textContent=tooLong+' '+(tooLong===1?'line is':'lines are')+' over 280 characters';
  else if(lines.length>room)preview.textContent='Room for '+Math.max(0,room)+' more tasks';
  else preview.textContent=lines.length+' '+(lines.length===1?'task':'tasks')+' ready · blank lines skipped';
}
function openImport(value,fromInput=false){
  if(fromInput){originalDraft=input.value;input.value='';}
  panel.hidden=false;trigger.setAttribute('aria-expanded','true');
  if(typeof value==='string')bulk.value=value;
  updateImportPreview();
  bulk.focus();
}
function closeImport(restoreDraft=false){
  panel.hidden=true;trigger.setAttribute('aria-expanded','false');
  if(restoreDraft&&originalDraft!==null)input.value=originalDraft;
  originalDraft=null;bulk.value='';updateImportPreview();
}
trigger.addEventListener('click',()=>{
  if(panel.hidden)openImport();
  else closeImport(true);
});
$('#cancelImport').addEventListener('click',()=>closeImport(true));
bulk.addEventListener('input',updateImportPreview);
confirm.addEventListener('click',()=>{
  const lines=parseLines(bulk.value);
  if(!lines.length||lines.length>1000-tasks.length||lines.some(x=>x.length>280))return;
  tasks.push(...lines.map(taskFromLine));
  save();render();closeImport(false);
  focusAfterAdding();
});
input.addEventListener('paste',e=>{
  const pasted=e.clipboardData?.getData('text/plain')||'';
  if(!/[\r\n\u2028\u2029]/.test(pasted))return;
  e.preventDefault();
  const prefix=input.value.trim();
  openImport((prefix?prefix+'\n':'')+pasted,true);
});
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const text=input.value.trim();if(!text){input.focus({preventScroll:true});return}
  if(tasks.length>=1000){alert('This list supports up to 1,000 active tasks.');return}
  tasks.push(taskFromLine(text));
  input.value='';save();render();focusAfterAdding();
});
$('#undo').addEventListener('click',()=>{
  if(last){tasks.splice(Math.min(last.idx,tasks.length),0,last.task);last=null;sortPinned();save();render()}
  hideToast();
});
sortPinned();render();
})();
